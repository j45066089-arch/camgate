name: build-ipa
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project CamGate.xcodeproj -scheme CamGate \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -destination "generic/platform=iOS" build
      - name: Copy ML models into app bundle
        run: |
          APP=build/Build/Products/Release-iphoneos/CamGate.app
          cp -R CamGate/Models/selfie_quality_model_v1_0_fp16.mlmodelc "$APP/"
          cp -R CamGate/Models/face_attributes_v1_3_f16.mlmodelc "$APP/"
          cp -R CamGate/Models/face_occlusion_v0_2_f16.mlmodelc "$APP/"
          ls -la "$APP" | head -20
      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/CamGate.app
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CamGate.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CamGate
          path: |
            CamGate.ipa
            build/Build/Products/Release-iphoneos/CamGate.app
