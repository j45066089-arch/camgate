name: CamGate
options:
  bundleIdPrefix: com.maurice
  deploymentTarget:
    iOS: "15.0"
targets:
  CamGate:
    type: application
    platform: iOS
    sources: [CamGate]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maurice.camgate
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Live-Check von Kopfposition, Licht und Schaerfe vor der Verifikations-Kamera."
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
